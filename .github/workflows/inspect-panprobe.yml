name: Inspect uploaded diagnostic archives

on:
  push:
    paths:
      - "*.zip"
      - "**/*.zip"
  workflow_dispatch:
    inputs:
      archive_path:
        description: "Repository-relative ZIP path (for example incoming/panprobe-run.zip)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select archives
        id: select
        shell: bash
        env:
          REQUESTED_ARCHIVE: ${{ inputs.archive_path }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/archives.txt"

          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ -n "${BEFORE_SHA:-}" ] && ! [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
              git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" -- '*.zip' | sort -u > "$RUNNER_TEMP/archives.txt"
            fi
          elif [ -n "${REQUESTED_ARCHIVE:-}" ]; then
            printf '%s\n' "$REQUESTED_ARCHIVE" > "$RUNNER_TEMP/archives.txt"
          else
            find . -maxdepth 5 -type f -iname '*.zip' -not -path './.git/*' -printf '%P\n' |
              sort | tail -n 1 > "$RUNNER_TEMP/archives.txt"
          fi

          if [ ! -s "$RUNNER_TEMP/archives.txt" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then
            find . -maxdepth 5 -type f -iname '*.zip' -not -path './.git/*' -printf '%P\n' |
              sort | tail -n 1 > "$RUNNER_TEMP/archives.txt"
          fi

          if [ ! -s "$RUNNER_TEMP/archives.txt" ]; then
            echo "No ZIP archive was selected. Upload a ZIP under incoming/ or set archive_path." >&2
            exit 1
          fi

          echo "Selected archive(s):"
          cat "$RUNNER_TEMP/archives.txt"

      - name: Inspect ZIP contents and extract diagnostic traces
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ARCHIVES < "$RUNNER_TEMP/archives.txt"
          python3 tools/inspect-archives.py --output-dir reports "${ARCHIVES[@]}"

      - name: Upload inspection reports
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-inspection-${{ github.run_number }}
          path: reports/*.txt
          if-no-files-found: error
          retention-days: 30
